services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: kdgram
      POSTGRES_USER: kdgram
      POSTGRES_PASSWORD: kdgram
    ports: ["5432:5432"]
    volumes: ["kdgram_db:/var/lib/postgresql/data","./schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  kdgram_db:
