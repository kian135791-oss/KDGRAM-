name: Extract KDGRAM release bundle

on:
  push:
    branches:
      - main
    paths:
      - "KDGRAM_GITHUB_READY.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract KDGRAM
        run: |
          mkdir -p .kdgram-extract
          unzip -o KDGRAM_GITHUB_READY.zip -d .kdgram-extract
          cp -a .kdgram-extract/. .
          rm -rf .kdgram-extract
          rm -f KDGRAM_GITHUB_READY.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract KDGRAM project" || echo "No changes"
          git push. 
